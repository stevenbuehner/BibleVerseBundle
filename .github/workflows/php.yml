name: PHP compatibility

on:
  push:
    tags:
      - '*'
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.3'
            dependency-set: 'Symfony 7.4 compatibility'
          - php-version: '8.4'
            dependency-set: 'latest compatible dependencies'
    name: PHP ${{ matrix.php-version }} / ${{ matrix.dependency-set }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: none
        tools: composer:v2

    - name: Check PHP Version
      run: php -v

    - name: Validate Composer metadata
      run: composer validate --strict

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction

    - name: Audit dependencies
      run: composer audit

    - name: Check PHP syntax
      run: find src Tests js/Generator -name '*.php' -print0 | xargs -0 -n1 php -l

    - name: Run test suite
      run: composer run-script test
